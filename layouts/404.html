{{ define "main" }}
<section class="bg-papier section">
  <div class="wrap wrap--narrow col" style="align-items: center; text-align: center">
    <img src="/img/brand/logo-coop.svg" alt="" width="140" height="140">
    <h1 class="h-page">{{ i18n "e404_title" }}</h1>
    <p class="lead">{{ i18n "e404_text" }}</p>
    <div class="btn-row" style="justify-content: center">
      <a class="btn" href="{{ i18n "url_home" }}">{{ i18n "e404_home" }}</a>
      <a class="btn btn--light" href="{{ i18n "url_contact" }}">{{ range where site.Menus.main "Weight" 60 }}{{ .Name }}{{ end }}</a>
    </div>
  </div>
</section>
{{ end }}
