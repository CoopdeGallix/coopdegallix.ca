<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ if .IsHome }}{{ site.Title }} – {{ i18n "tagline" }}{{ else }}{{ .Title }} – {{ site.Title }}{{ end }}{{ end }}</title>
  {{- $desc := .Description | default .Params.lead | default site.Params.description }}
  <meta name="description" content="{{ $desc | plainify }}">
  <meta name="author" content="{{ site.Params.fullname }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{- range .AllTranslations }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  {{- end }}
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ $desc | plainify }}">
  <meta property="og:image" content="{{ "CSG_cover_1.png" | absURL }}">
  <meta property="og:type" content="website">
  {{- if eq hugo.Environment "preview" }}
  <meta name="robots" content="noindex, nofollow">
  {{- end }}
  <meta name="google-site-verification" content="jat_spHSR0bOUKr1DmTxe6x0ukIyMb2fhLBubkxiDeU">

  <link rel="apple-touch-icon" sizes="120x120" href="/img/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png">
  <meta name="theme-color" content="#163a56">

  <script>document.documentElement.classList.remove('no-js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  {{- $css := resources.Get "css/site.css" }}
  {{- if hugo.IsProduction }}{{ $css = $css | minify | fingerprint }}{{ end }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">

 </head>
