baseURL: https://coopdegallix.ca/
title: Coop de Gallix
# navbar
params:
  fullname: Coopérative de solidarité de Gallix
  title: Coopérative de solidarité de Gallix
  images:
  - "CSG_cover_1.png"
  # schema stuff
  site_type: LocalBusiness
  local_business_type: FoodEstablishment
  org_name: Coopérative de solidarité de Gallix
  description: La Coop de Gallix est un projet qui a vu le jour afin de sortir le secteur de Gallix d'un désert alimentaire.

  nav:
    title: Coop de Gallix
    logo_light: /img/brand/logo_nav_light.svg
    logo_light_alt: Logo light
    logo_dark: /img/brand/logo_nav_dark.svg
    logo_dark_alt: Logo dark
    btn:
      title: Devenir membre
      url: /adhesion

  networking:
    site: coopdegallix.ca
    username: CoopdeGallix
    social:
    - link: https://facebook.com/CoopdeGallix
      icon: fab fa-facebook
    - link: https://instagram.com/CoopdeGallix
      icon: fab fa-instagram
    - link: https://github.com/CoopdeGallix
      icon: fab fa-github

  footer:
    title: Coopérative de solidarité de Gallix <br> *Une présence active dans notre communauté*
    newsletter:
      title: Abonnez-vous à notre infolettre
      subtitle: |
        Nous envoyons une infolettre au maximum une fois par mois.
        <span class="fw-bolder">Nous ne divulguerons jamais vos informations.</span>
      btn: M'abonner
      text_note: Une page ouvrira afin de confirmer que vous n'êtes pas un robot 🤖!

