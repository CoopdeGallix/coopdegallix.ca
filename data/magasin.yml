# Heures d'ouverture. `jours` : 0 = dimanche, 1 = lundi … 6 = samedi.
# Format 24 h (« 6:00 », « 22:00 »). Pour un jour fermé, laisser ouvre et ferme vides.
heures:
  - nom: { fr: Lundi au vendredi, en: Monday to Friday }
    jours: [1, 2, 3, 4, 5]
    ouvre: "6:00"
    ferme: "22:00"
  - nom: { fr: Samedi, en: Saturday }
    jours: [6]
    ouvre: "6:00"
    ferme: "22:00"
  - nom: { fr: Dimanche, en: Sunday }
    jours: [0]
    ouvre: "6:00"
    ferme: "22:00"

